<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/general.css">
    <script src="scripts/index.js" defer></script>
  </head>
  <body>
    <main>
      <div class="theme toggle-track">
        <div class="toggle-thumb"></div>
      </div>
      <h1>My Library</h1>
      <div class="book-container"></div>
      <button type="button" onclick="openAddBookDialog()" class="add-book-button priority-button">+ ADD BOOK</button>
    </main>

    <dialog class="add-book">
      <form onsubmit="processAddBookForm(); return false">
        <div>
          <label for="book-title">Title</label>
          <input type="text" name="title" id="book-title" required>
        </div>
        <div>
          <label for="book-author">Author</label>
          <input type="text" name="author" id="book-author" required>
        </div>
        <div>
          <label for="book-pages">Number of pages</label>
          <input type="number" name="pages" id="book-pages" required>
        </div>
        <div>
          <label for="book-status">Have read</label>
          <input type="checkbox" name="status" id="book-status">
        </div>
        <div>
          <button type="submit" class="priority-button">Submit</button>
          <button type="button" onclick="closeAddBookDialog()">Close</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
